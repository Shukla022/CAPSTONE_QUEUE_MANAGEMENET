[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qms"
version = "0.1.0"
description = "Multi-Objective AI-Driven Cloud-Based Queue Management System"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.2", "joblib>=1.2"]
app = ["streamlit>=1.28"]
genai = ["google-generativeai>=0.5", "google-genai>=0.2"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
